; ContractLabour Application PHP Configuration
; Optimized for speed and performance with PHP 8.2

; Memory limit - increased to 2GB for large data operations
memory_limit = 2G

; Maximum execution time in seconds
max_execution_time = 600

; Maximum time allowed for input parsing
max_input_time = 300

; Maximum file upload size
upload_max_filesize = 100M
post_max_size = 100M

; Error reporting - show errors in development, but suppress deprecation notices if needed
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; In local development, we want to log errors but prevent displaying raw warning screens
display_errors = Off
log_errors = On
log_errors_max_len = 1024
html_errors = Off

; Enable legacy short open tags (e.g. <? instead of <?php)
short_open_tag = On

; Set appropriate output buffering to avoid header issues
output_buffering = 4096

; Date/timezone settings
date.timezone = "Asia/Kolkata"

; OPcache settings for extra performance boost
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
