<VirtualHost *:8083>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html/clms-v2

    ErrorLog ${APACHE_LOG_DIR}/clms-v2-error.log
    CustomLog ${APACHE_LOG_DIR}/clms-v2-access.log combined

    <Directory /var/www/html/clms-v2>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [QSA,L]
        </IfModule>
    </Directory>

    # Prevent direct access to sensitive files
    <FilesMatch "\.(sql|md|env|log|sh|ini|json)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
